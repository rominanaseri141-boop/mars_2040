<main class="section page"><span class="eyebrow">فرم عضویت</span><h1>درخواست پیوستن به خدمه</h1>
<p class="lead">اگر فکر می‌کنی برای این مأموریت مناسب هستی، اطلاعات زیر را وارد کن.</p>
<form id="joinForm">
<label>نام و نام خانوادگی<input name="name" placeholder="مثلاً: رومینا ناصری" required></label>
<label>سن<input type="number" name="age" placeholder="مثلاً: ۲۵" required></label>
<label>رشته تحصیلی<input name="field" placeholder="مثلاً: مهندسی پزشکی" required></label>
<label>ایمیل<input type="email" name="email" placeholder="example@email.com" required></label>
<label>چرا می‌خواهی به مأموریت بپیوندی؟<textarea name="reason" rows="5" placeholder="دلیل خود را کوتاه بنویس..." required></textarea></label>
<button class="btn" type="submit">ثبت درخواست</button><p id="formMessage" class="message"></p>
</form></main><footer>© ۲۰۴۰ | پروژه مأموریت مریخ</footer><script src="script.js"></script>
